{% extends 'mailing_service/base.html' %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Список сообщений</h1>
</div>
<div class="card mb-4 box-shadow">
    {% for message in messages %}
    <div class="card-group">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ message.subject }}</h5>
                <p class="card-text">{{ message.letter }}</p>
                <a href="{% url 'mailing_service:message_detail' message.pk %}" class="btn btn-primary">Посмотреть</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
