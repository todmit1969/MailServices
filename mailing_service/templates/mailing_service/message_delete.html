{% extends 'mailing_service/base.html' %}
{% block title %}Удалить сообщение{% endblock %}
{% block content %}
<div class="container">
    <h2>Удалить сообщение</h2>
    <p>Вы уверены, что хотите удалить "{{ message.subject }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailing_service:messages_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
