{% extends 'mailing_service/base.html' %}
{% block title %}Удалить рассылку{% endblock %}
{% block content %}
<div class="container">
    <h2>Удалить рассылку</h2>
    <p>Вы уверены, что хотите удалить рассылку под номером"{{ mailing.id }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailing_service:mailings_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
