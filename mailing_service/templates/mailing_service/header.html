<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Mailing Service</h5>
    <nav class="ms-5">
        {% if user.is_manager %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:users_list' %}">Список Пользователей</a>
        {% endif %}
        {% if user.is_user %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing_service:recipients_list' %}">Список Получателей</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing_service:recipient_create' %}">Добавить
            Получателя</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing_service:messages_list' %}">Список Сообщений</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing_service:message_create' %}">Добавить Сообщение</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing_service:mailings_list' %}">Список Рассылок</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing_service:mailing_create' %}">Добавить Рассылку</a>
        <a class="p-2 btn btn-outline-danger" href="{% url 'mailing_service:home' %}">Вернуться на главную страницу</a>
        <form method="post" action="{% url 'users:logout' %}" style="display: inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Зарегистрироваться</a>
        {% endif %}
    </nav>
</div>
